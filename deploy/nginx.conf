# SPA（history 模式）—— 任何路徑都回 index.html，交給 vue-router 處理
# 少了 try_files 這行，使用者在 /pools/p1 重新整理就會 404。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 帶 hash 的資源檔可以永久快取
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html 不可快取，否則改版後使用者會拿到舊的資源清單
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
