name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 避免同時有兩個部署互相搶——只保留最新的一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_API_URL 是 repo 的 Variable（Settings → Secrets and variables → Actions → Variables）。
      # 沒設就是 mock 模式；設成 Railway 的網址前端就打真的後端。切換不用改程式。
      - run: npm run build:pages
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # 404.html（SPA 深層連結的退回）現在由 scripts/seo.mjs 產生，
      # build:pages 裡已經包含。這裡原本有一行 cp dist/index.html dist/404.html，
      # 會把那份蓋掉 —— 連同它的 noindex 一起洗掉。
      # 404.html 一定要 noindex：它是每一個不存在網址的內容，
      # 被收錄等於在搜尋結果裡塞一堆重複頁。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
