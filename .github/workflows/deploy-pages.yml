name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 避免同時有兩個部署互相搶——只保留最新的一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_API_URL 是 repo 的 Variable（Settings → Secrets and variables → Actions → Variables）。
      # 沒設就是 mock 模式；設成 Railway 的網址前端就打真的後端。切換不用改程式。
      - run: npm run build:pages
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # SPA 的深層連結退回。GitHub Pages 是靜態檔案伺服器，/design/smoke
      # 這種路徑在磁碟上沒有對應檔案，直接開會吃 404 —— 只有從首頁點進去才會動，
      # 因為那是 history.pushState 不是真的請求。
      # Pages 找不到檔案時會送 404.html，把它做成 index.html 的複本，
      # 應用程式就會照樣啟動，再由 vue-router 依網址決定顯示哪一頁。
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
